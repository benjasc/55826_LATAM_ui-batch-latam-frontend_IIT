<app-header />

@if (loading()) {
  <!-- Mismo fondo y posición que el modal, para que el modal reemplace a la tarjeta sin salto visual -->
  <div class="loading-backdrop">
    <app-loading-card message="Cargando sus organizaciones…" hint="Esto puede tardar unos segundos." />
  </div>
}

<main class="content container-fluid">
  @if (startupError(); as message) {
    <app-error-page title="¡Ha ocurrido un problema!" [message]="message" [showHomeLink]="false" />
    <div class="retry">
      <button mat-flat-button (click)="start()">Reintentar</button>
    </div>
  } @else if (context.hasContext()) {
    <!-- Las pantallas solo se muestran cuando ya hay organización y orquestación elegidas -->
    <router-outlet />
  }
</main>
